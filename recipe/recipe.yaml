schema_version: 1

context:
  version: "1.16.0"

package:
  name: pystac-core
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pystac-core/pystac_core-${{ version }}.tar.gz
  sha256: 98e58f7b4fb164251a8442a5cf2e04cb9859eaf00e203d2c1f333bd63082880e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - python-dateutil >=2.7.0
    - pystac-core

tests:
  - python:
      imports:
        - pystac
        - pystac.extensions.base
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Core functionality for PySTAC without extensions. Most users will want to use pystac, not this package
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://pypi.org/project/pystac-core/
  documentation: https://pystac.readthedocs.io

extra:
  recipe-maintainers:
    - ocefpaf
